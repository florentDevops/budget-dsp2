<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
/* En-tête */
header { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
header h1 { font-size: 1.05rem; font-weight: 600; margin-right: auto; }
.select, .btn {
  border: 1px solid var(--rule); background: var(--surface);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; min-height: 38px;
}
.btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 500; }
.btn:disabled { opacity: .5; cursor: wait; }

a.btn { display: inline-flex; align-items: center; color: inherit; text-decoration: none; white-space: nowrap; }

/* Surligneur : l'élément signature de l'interface */
.hl {
  background-image: linear-gradient(transparent 14%, var(--marker) 14%, var(--marker) 90%, transparent 90%);
  background-repeat: no-repeat;
  background-size: 100% 100%;
  border-radius: .25em .6em .3em .5em;
  padding: 0 .22em; margin: 0 -.08em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.hero .hl { animation: sweep .9s .25s cubic-bezier(.3,.7,.2,1) both; }
@keyframes sweep { from { background-size: 0% 100%; } }
@media (prefers-reduced-motion: reduce) { .hero .hl { animation: none; } }

/* Accroche */
.hero { margin-bottom: 32px; }
.hero p.lead {
  font-size: clamp(1.7rem, 6.2vw, 2.45rem); line-height: 1.18;
  font-weight: 500; letter-spacing: -.015em; max-width: 19ch;
}
.hero .hl { font-weight: 600; }
.hero p.sub { color: var(--muted); margin-top: 14px; max-width: 52ch; }

/* Barre de répartition */
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 22px 0 10px; background: var(--rule); }
.split span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .9rem; color: var(--muted); }
.legend b { color: var(--ink); font-weight: 500; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

section { margin-top: 40px; }
section h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
section > p.hint { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }

/* Pistes d'économies */
.insights { list-style: none; padding: 0; margin: 0; background: var(--surface); border-radius: 12px; }
.insights li { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 14px 16px; border-top: 1px solid var(--rule); }
.insights li:first-child { border-top: 0; }
.insights .t { font-weight: 500; }
.insights .d { grid-column: 1 / -1; color: var(--muted); font-size: .9rem; max-width: 60ch; }
.insights .a { text-align: right; font-weight: 500; white-space: nowrap; line-height: 1.3; }
.insights .y { display: block; color: var(--muted); font-size: .82rem; font-weight: 400; }

/* Filtres */
.filters { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0 12px; padding-bottom: 2px; }
.filters button {
  border: 1px solid var(--rule); background: transparent; border-radius: 999px;
  padding: 5px 13px; font-size: .9rem; white-space: nowrap; cursor: pointer;
}
.filters button span { color: var(--muted); margin-left: 2px; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters button[aria-pressed="true"] span { color: inherit; opacity: .7; }

/* Opérations */
.tx { list-style: none; padding: 0; margin: 0; background: var(--surface); border-radius: 12px; }
.tx li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 14px; padding: 11px 16px; border-top: 1px solid var(--rule); }
.tx li:first-child { border-top: 0; }
.tx .m { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .meta { grid-column: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .84rem; color: var(--muted); }
.tx .amt { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-weight: 500; white-space: nowrap; }
.tx .amt.in { color: var(--keep); }
.tx select {
  border: 0; background: transparent; color: var(--muted); font-size: .84rem;
  padding: 2px 0; cursor: pointer; max-width: 11rem;
  text-decoration: underline dotted; text-underline-offset: 3px;
}
.tag { color: var(--ink); }
.more { display: block; margin: 12px auto 0; }
.more[hidden] { display: none; }

/* Catégories */
.cats { list-style: none; padding: 0; margin: 0; }
.cats button {
  display: grid; grid-template-columns: 9.5rem 1fr 5.5rem; align-items: center; gap: 12px; width: 100%;
  padding: 7px 0; font-size: .92rem; text-align: left; border: 0; background: transparent; cursor: pointer;
}
.cats button:hover .bar { background: var(--muted); }
.cats.has-sel button[aria-pressed="false"] { opacity: .45; }
.cats button[aria-pressed="true"] > span:first-child { font-weight: 600; }
.cats button[aria-pressed="true"] > span:first-child::before { content: "✓ "; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.link { border: 0; background: transparent; color: var(--muted); font-size: .88rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 2px 0; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -4px 0 12px; }
.chip { border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 3px 6px 3px 10px; font-size: .86rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { margin: 0; }
.chip b { font-weight: 400; color: var(--muted); }
.nag { color: var(--muted); font-size: .84rem; font-style: italic; margin: -4px 0 12px; }
.cats .bar { height: 10px; transition: background .15s; border-radius: 5px; background: var(--rule); overflow: hidden; }
.cats .bar span { display: block; height: 100%; border-radius: 5px; }
.cats .v { text-align: right; }

/* Squelette de chargement (changement de mois) */
.sk {
  display: block; border-radius: 6px; margin: 6px 0;
  background: linear-gradient(90deg, var(--rule) 30%, var(--surface) 50%, var(--rule) 70%) 0 0 / 300% 100%;
  animation: shimmer 1.2s linear infinite;
}
.insights .sk, .tx .sk { margin: 4px 0; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

/* États vides et connexion */
.empty { background: var(--surface); border-radius: 12px; padding: 24px 20px; }
.empty p { color: var(--muted); margin: 6px 0 18px; max-width: 48ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.connect { margin-top: 18px; display: none; gap: 10px; flex-wrap: wrap; }
.connect.open { display: flex; }
.connect select { flex: 1 1 14rem; }
.connect .psu { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; min-height: 38px; }
.connect .psu button { border: 0; background: var(--surface); padding: 0 14px; cursor: pointer; }
.connect .psu button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.connect .psu-only { align-self: center; color: var(--muted); font-size: .9rem; }
.connect-note { color: var(--muted); font-size: .84rem; margin: 12px 0 0; max-width: 60ch; }

/* Comptes connectés */
.accounts { list-style: none; padding: 0; margin: 0; background: var(--surface); border-radius: 12px; }
.accounts li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--rule); }
.accounts li:first-child { border-top: 0; }
.accounts input {
  font: inherit; font-weight: 500; color: inherit; border: 0; border-bottom: 1px dashed var(--rule);
  background: transparent; padding: 2px 0; width: 100%; min-width: 0;
}
.accounts input:focus { border-bottom-color: var(--ink); outline: none; }
.accounts .meta { grid-column: 1 / -1; font-size: .84rem; color: var(--muted); }
.accounts select { min-height: 32px; padding: 3px 8px; }
.filters.acc { margin-bottom: 4px; }
.tag.flow { color: var(--muted); }
.tx .link { font-size: .84rem; }
#status {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(640px, calc(100% - 32px)); padding: 10px 14px; border-radius: 10px;
  background: var(--ink); color: var(--paper); font-size: .9rem;
}
#status:empty { display: none; }
#status.err { background: var(--danger); color: #fff; }
footer { margin-top: 48px; font-size: .85rem; color: var(--muted); }

@media (max-width: 480px) {
  /* « Ajouter un compte » toujours présent : les boutons passent à la ligne plutôt que déborder */
  header { margin-bottom: 28px; flex-wrap: wrap; }
  header h1 { flex-basis: 100%; }
  .cats button { grid-template-columns: 7.5rem 1fr 4.8rem; gap: 8px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Budget</h1>
    <a class="btn" href="/tendances">Tendances</a>
    <select id="month" class="select" aria-label="Mois affiché" hidden></select>
    <a id="goto-accounts" class="btn" href="#accounts" hidden>Comptes</a>
    <button id="add-bank" class="btn" hidden>Ajouter un compte</button>
    <button id="sync" class="btn" hidden>Synchroniser</button>
  </header>

  <div id="app"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <footer id="footer"></footer>
</main>

<script src="/static/filters.js"></script>
<script src="/static/accounts.js"></script>
<script src="/static/colors.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const eur = (n, d = 0) => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: d, minimumFractionDigits: d }).format(n);
const monthName = (m) => new Date(m + "-01T12:00").toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
const dayLabel = (d) => new Date(d + "T12:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pretty = (m) => m.split(" ").map(w => (w.length <= 3 && /^[A-Z]+$/.test(w)) ? w : w.charAt(0) + w.slice(1).toLowerCase()).join(" ");

const NATURE = {
  essentiel:   { label: "Essentiel",   color: "var(--keep)" },
  optimisable: { label: "Optimisable", color: "var(--marker)" },
  epargne:     { label: "Épargne",     color: "var(--save)" },
  inconnu:     { label: "À classer",   color: "var(--unknown)" },
};
const REASONS = { abonnement: "Abonnement", micro: "Micro-dépense répétée", hausse: "Catégorie en hausse", frais: "Frais évitable", contrat: "Contrat à comparer" };
const FILTERS = [
  ["all", "Toutes"], ["optimisable", "À optimiser"], ["essentiel", "Essentielles"], ["inconnu", "À classer"], ["in", "Entrées"],
];
let state = { status: null, categories: [], roles: [], summary: null, filter: "optimisable", cats: new Set(), account: null, limit: 40 };

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `Erreur ${res.status}`);
  return body;
}
let sayTimer;
function say(msg, isErr = false) {
  const s = $("#status"); s.textContent = msg; s.className = isErr ? "err" : "";
  clearTimeout(sayTimer);
  if (!isErr) sayTimer = setTimeout(() => { s.textContent = ""; }, 4000);
}

async function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get("error")) say("La connexion à la banque n'a pas abouti. Relance-la depuis « Connecter ma banque ».", true);
  const connected = params.get("connected");
  if (connected) say("Banque connectée, opérations importées. Vérifie le rôle de chaque compte dans « Comptes ».");
  if (params.toString()) history.replaceState({}, "", "/");

  [state.status, state.categories, state.roles] = await Promise.all([api("/api/status"), api("/api/categories"), api("/api/account-roles")]);
  if (!state.status.accounts.some(a => a.uid === state.account)) state.account = null;
  state.categories.sort((a, b) => a.label.localeCompare(b.label, "fr"));
  renderFooter();
  if (!state.status.months.length) return renderEmpty();

  const sel = $("#month");
  const current = sel.value;
  sel.innerHTML = state.status.months.map(m => `<option value="${m}">${monthName(m)}</option>`).join("");
  if (state.status.months.includes(current)) sel.value = current;
  sel.hidden = false;
  const hasBank = state.status.accounts.some(a => a.connected);
  $("#sync").hidden = !hasBank;
  $("#add-bank").hidden = !state.status.bank_enabled;  // autant de banques et de comptes que voulu
  $("#goto-accounts").hidden = !state.status.accounts.length;
  await loadMonth(sel.value);
  if (connected) $("#accounts").scrollIntoView({ behavior: "smooth" });
}

async function loadMonth(month) {
  const req = state.monthReq = (state.monthReq || 0) + 1;
  const slow = setTimeout(renderSkeleton, 120); // pas de flash si la réponse est immédiate
  try {
    const summary = await api(`/api/summary?month=${month}`);
    if (req !== state.monthReq) return; // un autre mois a été choisi entretemps
    state.summary = summary;
    state.limit = 40;
    render();
  } finally {
    clearTimeout(slow);
  }
}

function renderSkeleton() {
  const line = (w, h = ".9rem") => `<span class="sk" style="width:${w};height:${h}"></span>`;
  $("#app").innerHTML = `
    <div aria-busy="true" aria-label="Chargement du mois">
      <div class="hero">
        ${line("85%", "2.2rem")}${line("55%", "2.2rem")}
        <div style="margin-top:14px">${line("70%")}</div>
        <div class="split"></div>
        ${line("60%")}
      </div>
      <section>
        ${line("10rem", "1.05rem")}
        <ul class="insights">${[1, 2, 3].map(() => `<li>${line("65%")}${line("4rem")}</li>`).join("")}</ul>
      </section>
      <section>
        ${line("8rem", "1.05rem")}
        <ul class="tx">${[1, 2, 3, 4, 5].map(() => `<li>${line("50%")}${line("4rem")}</li>`).join("")}</ul>
      </section>
    </div>`;
}

function renderEmpty() {
  const bank = state.status.bank_enabled;
  $("#app").innerHTML = `
    <div class="empty">
      <h2>Aucune opération pour l'instant</h2>
      <p>${bank ? "Connecte ton compte pour importer tes opérations, ou explore l'interface avec un relevé fictif."
                : "Enable Banking n'est pas encore configuré (voir le README). En attendant, charge un relevé fictif de six mois."}</p>
      <div class="row">
        ${bank ? `<button class="btn btn-primary" id="open-connect">Connecter ma banque</button>` : ""}
        <button class="btn" id="demo">Charger la démo</button>
      </div>
      ${connectForm()}
    </div>`;
  $("#demo").onclick = async (e) => {
    e.target.disabled = true; say("Import et classement du relevé fictif…");
    const r = await api("/api/demo", { method: "POST" });
    say(`${r.inserted} opérations fictives importées.`);
    boot();
  };
  if (bank) $("#open-connect").onclick = openConnect;
}

const connectForm = () => `
  <div class="connect" id="connect">
    <select class="select" id="bank" aria-label="Ta banque"><option>Chargement des banques…</option></select>
    <span id="psu"></span>
    <button class="btn btn-primary" id="go">Continuer vers ma banque</button>
  </div>`;

async function openConnect() {
  $("#connect").classList.add("open");
  let banks = [], psu = "personal";
  const renderPsu = () => {
    const opts = psuOptions(banks.find(b => b.name === $("#bank").value));
    if (!opts.some(o => o.id === psu)) psu = opts[0].id;
    $("#psu").innerHTML = opts.length > 1
      ? `<span class="psu" role="group" aria-label="Type de compte">${opts.map(o => `<button type="button" data-psu="${o.id}" aria-pressed="${o.id === psu}">${o.label}</button>`).join("")}</span>`
      : `<span class="psu-only">Compte ${opts[0].label.toLowerCase()} uniquement</span>`;
    document.querySelectorAll("[data-psu]").forEach(b => b.onclick = () => { psu = b.dataset.psu; renderPsu(); });
  };
  try {
    banks = await api("/api/banks");
    $("#bank").innerHTML = banks.map(b => `<option>${esc(b.name)}</option>`).join("");
    renderPsu();
  } catch (e) { say(e.message, true); }
  $("#bank").onchange = renderPsu;
  $("#go").onclick = async () => {
    try {
      const { url } = await api("/api/connect", { method: "POST", body: JSON.stringify({ bank: $("#bank").value, psu_type: psu }) });
      location.href = url;
    } catch (e) { say(e.message, true); }
  };
}

function render() {
  const s = state.summary;
  const n = s.by_nature;
  const parts = ["essentiel", "optimisable", "inconnu", "epargne"].filter(k => n[k] > 0);
  const total = parts.reduce((a, k) => a + n[k], 0);

  $("#app").innerHTML = `
    <div class="hero">
      <p class="lead">En ${monthName(s.month).split(" ")[0]}, environ <span class="hl">${eur(s.savings_estimate)}</span> de dépenses sont récupérables.</p>
      <p class="sub">${eur(s.spent)} dépensés pour ${eur(s.income)} de revenus. L'estimation applique une part récupérable à chaque catégorie optimisable, frais bancaires en tête.</p>
      <div class="split" role="img" aria-label="Répartition des dépenses">
        ${parts.map(k => `<span style="width:${(n[k] / total * 100).toFixed(2)}%;background:${NATURE[k].color}"></span>`).join("")}
      </div>
      <div class="legend">
        ${parts.map(k => `<span><i class="dot" style="background:${NATURE[k].color}"></i>${NATURE[k].label} <b>${eur(n[k])}</b></span>`).join("")}
      </div>
    </div>

    ${s.insights.length ? `
    <section>
      <h2>À revoir en priorité</h2>
      <p class="hint">Les pistes les plus rentables, calculées sur ce mois et les précédents.</p>
      <ul class="insights">
        ${s.insights.map(i => `
          <li>
            <span class="t">${esc(i.title)}</span>
            <span class="a">${i.kind === "hausse" ? "+" : ""}${eur(i.amount, 2)}${i.kind === "hausse" ? "" : " /mois"}
              <span class="y">${i.yearly ? eur(i.yearly) + " /an" : "vs moyenne"}</span></span>
            <span class="d">${esc(i.detail)}</span>
          </li>`).join("")}
      </ul>
    </section>` : ""}

    <section id="ops">
      <h2>Opérations</h2>
      <p class="hint">Les montants surlignés sont ceux sur lesquels tu peux agir. Une catégorie changée s'applique à toutes les opérations du marchand.</p>
      ${state.status.accounts.length > 1 ? `
      <div class="filters acc" role="group" aria-label="Filtrer par compte">
        <button data-acc="" aria-pressed="${!state.account}">Tous les comptes</button>
        ${state.status.accounts.map(a => `<button data-acc="${esc(a.uid)}" aria-pressed="${state.account === a.uid}">${esc(accountName(a))} <span>${filterTransactions(s.transactions, "all", new Set(), a.uid).length}</span></button>`).join("")}
      </div>` : ""}
      <div class="filters" role="group" aria-label="Filtrer les opérations">
        ${FILTERS.map(([k, l]) => `<button data-f="${k}" aria-pressed="${state.filter === k}">${l} <span>${filterTx(k).length}</span></button>`).join("")}
      </div>
      ${s.cheque_nag ? `<p class="nag">${esc(s.cheque_nag)}</p>` : ""}
      ${state.cats.size ? `
      <div class="chips" aria-label="Catégories filtrées">
        ${[...state.cats].map(id => `<button class="chip" data-cat="${esc(id)}" aria-label="Retirer le filtre ${esc(catLabel(id))}"><i class="dot" style="background:${catColor({ category: id })}"></i>${esc(catLabel(id))} <b aria-hidden="true">✕</b></button>`).join("")}
        <button class="link" data-clear-cats>Tout effacer</button>
      </div>` : ""}
      <ul class="tx" id="tx"></ul>
      <button class="btn more" id="more" hidden>Afficher plus</button>
    </section>

    <section>
      <div class="sec-head">
        <h2>Par catégorie</h2>
        ${state.cats.size ? `<span><button class="link" data-goto-ops>Voir les ${filterTx(state.filter).length} opérations ↑</button> · <button class="link" data-clear-cats>Effacer ✕</button></span>` : ""}
      </div>
      <p class="hint">Clique une ou plusieurs catégories pour filtrer les opérations.</p>
      <ul class="cats ${state.cats.size ? "has-sel" : ""}">
        ${s.by_category.map(c => `
          <li><button data-cat="${esc(c.category)}" aria-pressed="${state.cats.has(c.category)}">
            <span>${esc(c.label)}</span>
            <span class="bar"><span style="width:${(c.amount / s.by_category[0].amount * 100).toFixed(1)}%;background:${catColor(c)}"></span></span>
            <span class="v">${eur(c.amount)}</span>
          </button></li>`).join("")}
      </ul>
    </section>

    <section id="accounts"></section>`;

  document.querySelectorAll(".filters button").forEach(b => b.onclick = () => { state.filter = b.dataset.f; state.limit = 40; render(); });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    // 1re catégorie choisie : on lève le filtre de nature, sinon « Courses » sous « À optimiser » serait vide
    if (!state.cats.size) state.filter = "all";
    state.cats = toggleCategory(state.cats, b.dataset.cat);
    state.limit = 40;
    render();
  });
  document.querySelectorAll("[data-clear-cats]").forEach(b => b.onclick = () => { state.cats = new Set(); state.limit = 40; render(); });
  document.querySelectorAll("[data-acc]").forEach(b => b.onclick = () => { state.account = b.dataset.acc || null; state.limit = 40; render(); });
  document.querySelector("[data-goto-ops]")?.addEventListener("click", () => $("#ops").scrollIntoView({ behavior: "smooth" }));
  renderTx();
  renderAccounts();
}

const filterTx = (k) => filterTransactions(state.summary.transactions, k, state.cats, state.account);
const accountById = (uid) => state.status.accounts.find(a => a.uid === uid);
const catLabel = (id) => state.categories.find(c => c.id === id)?.label ?? id;

function renderTx() {
  const s = state.summary;
  const list = filterTx(state.filter);
  const catOptions = (cur) => state.categories.map(c => `<option value="${c.id}" ${c.id === cur ? "selected" : ""}>${esc(c.label)}</option>`).join("");
  $("#tx").innerHTML = list.slice(0, state.limit).map(t => {
    const flags = s.flags[t.id] || [];
    const reasons = flags.filter(r => r !== "optimisable").map(r => REASONS[r]).filter(Boolean);
    return `
      <li>
        <span class="m" title="${esc(t.label)}">${esc(pretty(t.merchant))}</span>
        <span class="amt ${t.amount > 0 ? "in" : ""}"><span class="${flags.includes("optimisable") ? "hl" : ""}">${eur(t.amount, 2)}</span></span>
        <span class="meta">
          <span>${dayLabel(t.date)}</span>
          ${state.status.accounts.length > 1 && accountById(t.account_uid) ? `<span>${esc(accountName(accountById(t.account_uid)))}</span>` : ""}
          <select data-key="${esc(t.merchant_key)}" data-merchant="${esc(t.merchant)}" aria-label="Catégorie de ${esc(pretty(t.merchant))}">${catOptions(t.category)}</select>
          ${reasons.map(r => `<span class="tag">${r}</span>`).join("")}
          ${(f => f ? `<span class="tag flow">${esc(f.text)}</span>${f.kind === "interne" ? `<button class="link" data-unpair="${esc(t.id)}" title="Ce n'est pas un virement entre tes comptes">Dissocier</button>` : ""}` : "")(flowTag(t, state.status.accounts))}
        </span>
      </li>`;
  }).join("") || `<li><span class="meta">Aucune opération dans ce filtre.</span></li>`;

  const more = $("#more");
  more.hidden = list.length <= state.limit;
  more.onclick = () => { state.limit += 40; renderTx(); };

  document.querySelectorAll("[data-unpair]").forEach(b => b.onclick = async () => {
    try {
      await api(`/api/transactions/${encodeURIComponent(b.dataset.unpair)}/transfer`, { method: "PUT", body: JSON.stringify({ peer: null }) });
      say("Opérations dissociées : chacune reprend son classement habituel.");
      await loadMonth(state.summary.month);
    } catch (e) { say(e.message, true); }
  });

  document.querySelectorAll("#tx select").forEach(sel => sel.onchange = async () => {
    const merchant = sel.dataset.merchant;
    const label = sel.options[sel.selectedIndex].text;
    try {
      const r = await api(`/api/merchants/${encodeURIComponent(sel.dataset.key)}`, { method: "PUT", body: JSON.stringify({ category: sel.value }) });
      say(`${pretty(merchant)} classé en ${label} (${r.updated} opérations).`);
      await loadMonth(state.summary.month);
    } catch (e) { say(e.message, true); }
  });
}

function renderAccounts() {
  const accs = state.status.accounts;
  const el = $("#accounts");
  if (!accs.length) { el.innerHTML = ""; return; }
  const date = (d) => new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
  el.innerHTML = `
    <h2>Comptes</h2>
    <p class="hint">Le rôle décide comment comptent les virements entre tes comptes : courant (dans le budget), épargne et épargne enfants (ce qui y arrive est de l'épargne), pro (hors budget, sauf ce qu'il te verse ou met de côté), crédit (prêt, hors budget : l'échéance compte côté compte courant).</p>
    <p class="hint">Les banques n'ouvrent que les comptes de paiement : tes livrets (livret A, LDD, livrets des enfants) n'apparaîtront pas ici. Classe plutôt les virements qui y partent en Épargne ou Épargne enfants dans la liste des opérations : ils compteront dans ton épargne.</p>
    <ul class="accounts">
      ${accs.map(a => `<li>
        <input value="${esc(a.label || "")}" placeholder="${esc(accountName({ ...a, label: null }))}" data-label="${esc(a.uid)}" aria-label="Nom affiché du compte ${esc(accountName(a))}">
        <select class="select" data-role="${esc(a.uid)}" aria-label="Rôle du compte ${esc(accountName(a))}">
          ${state.roles.map(r => `<option value="${r.id}" ${r.id === a.role ? "selected" : ""}>${esc(r.label)}</option>`).join("")}
        </select>
        <span class="meta">${[
          esc(a.bank), a.psu_type === "business" ? "connexion pro" : "",
          a.product && a.label ? esc(accountName({ ...a, label: null })) : "",
          a.last_sync ? `synchro le ${date(a.last_sync)}` : "jamais synchronisé",
          a.valid_until ? `accès jusqu'au ${date(a.valid_until)}` : "",
        ].filter(Boolean).join(" · ")}</span>
      </li>`).join("")}
    </ul>`;
  const save = async (uid, body, msg) => {
    try {
      await api(`/api/accounts/${encodeURIComponent(uid)}`, { method: "PUT", body: JSON.stringify(body) });
      state.status = await api("/api/status");
      say(msg);
      await loadMonth(state.summary.month);  // le rôle change les totaux du mois
    } catch (e) { say(e.message, true); }
  };
  el.querySelectorAll("[data-role]").forEach(sel => sel.onchange = () =>
    save(sel.dataset.role, { role: sel.value }, `Rôle enregistré : ${sel.options[sel.selectedIndex].text}.`));
  el.querySelectorAll("[data-label]").forEach(inp => {
    inp.onkeydown = (e) => { if (e.key === "Enter") inp.blur(); };
    inp.onchange = () => save(inp.dataset.label, { label: inp.value }, "Nom du compte enregistré.");
  });
}

function renderFooter() {
  const st = state.status;
  $("#footer").textContent = [
    st.llm_enabled ? "Les marchands inconnus sont classés par Claude." : "Classement par règles uniquement. Ajoute une clé Anthropic dans .env pour classer les marchands inconnus.",
  ].filter(Boolean).join(" ");
}

$("#month").onchange = (e) => loadMonth(e.target.value);
$("#add-bank").onclick = () => {
  if (!$("#connect")) {
    $("#app").insertAdjacentHTML("afterbegin", `
      <div class="empty" style="margin-bottom:32px">
        <h2>Ajouter un compte</h2>
        <p>Tu seras redirigé vers ta banque pour valider l'accès en lecture seule. Tous les comptes que tu autorises sont ajoutés ; tu choisis ensuite le rôle de chacun dans « Comptes ».</p>
        ${connectForm()}
        <p class="connect-note">En mode gratuit d'Enable Banking, seuls les comptes déjà liés dans ton portail Enable Banking sont visibles : ajoute-les d'abord là-bas.</p>
      </div>`);
  }
  openConnect();
};
$("#sync").onclick = async (e) => {
  e.target.disabled = true; say("Synchronisation en cours…");
  try {
    const r = await api("/api/sync", { method: "POST" });
    say(r.errors.length ? `Synchro partielle : ${r.errors.map(x => x.account).join(", ")} en erreur. Le consentement a peut-être expiré, reconnecte la banque.` : `${r.inserted} nouvelles opérations.`, r.errors.length > 0);
    await boot();
  } catch (err) { say(err.message, true); }
  e.target.disabled = false;
};

boot().catch(e => say(e.message, true));
</script>
</body>
</html>
