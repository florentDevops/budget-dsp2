<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tendances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
main { max-width: 860px; }
header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
header h1 { font-size: 1.05rem; font-weight: 600; margin-right: auto; }
header a { color: var(--muted); font-size: .92rem; text-underline-offset: 3px; }
header a:hover { color: var(--ink); }

.lead { font-size: clamp(1.3rem, 4.4vw, 1.75rem); line-height: 1.25; font-weight: 500; letter-spacing: -.01em; max-width: 30ch; }
.sub { color: var(--muted); margin-top: 10px; max-width: 60ch; }
.sub a { color: inherit; text-underline-offset: 3px; }

/* Période + catégories : une seule rangée de contrôles au-dessus du graphique */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 24px 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; font-size: .88rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.hint { color: var(--muted); font-size: .88rem; }

.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
.legend button {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--surface);
  border-radius: 999px; padding: 4px 11px 4px 9px; font-size: .86rem; cursor: pointer;
}
.legend button b { font-weight: 400; color: var(--muted); }
.legend.has-focus button[aria-pressed="false"] { opacity: .5; }
.legend button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 500; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sw.hatch { background-image: repeating-linear-gradient(45deg, var(--unknown) 0 2px, transparent 2px 4px) !important; box-shadow: inset 0 0 0 1px var(--unknown); }

.card { background: var(--surface); border-radius: 12px; padding: 16px 12px 8px; position: relative; }
#chart svg { display: block; width: 100%; overflow: visible; }
#chart text { font: 400 12px "IBM Plex Sans", system-ui, sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
#chart text.v { fill: var(--ink); font-weight: 500; }
#chart .grid { stroke: var(--rule); stroke-width: 1; }
#chart .col { fill: transparent; cursor: pointer; }
#chart .col:hover, #chart .col.on { fill: var(--ink); fill-opacity: .04; }
#chart .seg-mark { transition: opacity .15s; }
#chart .dim { opacity: .22; }

.tip {
  position: absolute; pointer-events: none; z-index: 2; min-width: 190px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 6px 20px rgb(0 0 0 / .12); padding: 9px 12px; font-size: .84rem;
}
.tip[hidden] { display: none; }
.tip h3 { margin: 0 0 4px; font-size: .86rem; font-weight: 600; }
.tip div { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 1px 0; }
.tip div.f { font-weight: 600; }
.tip div.t { border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 4px; grid-template-columns: 1fr auto; }

section { margin-top: 36px; }
section h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
.scroll { overflow-x: auto; background: var(--surface); border-radius: 12px; margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; }
th { font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--rule); }
tbody tr { cursor: pointer; }
tbody tr:hover th { text-decoration: underline; text-underline-offset: 3px; }
tbody th, thead th:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); color: var(--ink); font-weight: 500; }
tbody th .sw { display: inline-block; margin-right: 8px; vertical-align: -1px; }
tbody tr.on th { font-weight: 600; }
tbody td.z { color: var(--muted); }
td.avg { color: var(--muted); border-left: 1px solid var(--rule); }
tfoot td, tfoot th { border-top: 1px solid var(--rule); font-weight: 600; text-align: right; }
tfoot th { text-align: left; position: sticky; left: 0; background: var(--surface); }

.empty { background: var(--surface); border-radius: 12px; padding: 24px 20px; color: var(--muted); }
.empty a { color: var(--ink); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tendances</h1>
    <a href="/">← Mois en cours</a>
  </header>
  <div id="app"></div>
</main>

<script src="/static/colors.js"></script>
<script src="/static/trends.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const eur = (n) => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const monthLong = (m) => new Date(m + "-01T12:00").toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
const monthShort = (m, withYear) => new Date(m + "-01T12:00").toLocaleDateString("fr-FR", withYear ? { month: "short", year: "2-digit" } : { month: "short" });
const sum = (xs) => xs.reduce((a, b) => a + b, 0);

const TOP = 7;  // 7 catégories nommées + Autres + À classer : au-delà, les teintes ne se distinguent plus
const RANGES = [[6, "6 mois"], [12, "12 mois"], [0, "Tout"]];
// Teinte fixe par catégorie (colors.js) ; les catégories sans teinte propre et « Autres » en gris
// neutre, « À classer » hachuré pour se lire comme « pas encore connu », pas comme une catégorie.
const fill = (c) => c === "inconnu" ? "url(#hatch)" : c === "autres" ? "var(--other)"
  : (CAT_COLOR[c] || (c === state.focus ? "var(--ink)" : "var(--other)"));
const swatch = (c) => `<i class="sw ${c === "inconnu" ? "hatch" : ""}" style="background:${fill(c) === "url(#hatch)" ? "transparent" : fill(c)}"></i>`;

let state = { trends: null, range: 12, focus: new URLSearchParams(location.search).get("cat"), hover: null };  // /tendances?cat=courses

function view() {
  const v = lastMonths(state.trends, state.range);
  if (state.focus && !v.categories.some(c => c.category === state.focus)) state.focus = null;
  return { ...v, series: groupSeries(v.categories, TOP, state.focus, (c) => c in CAT_COLOR) };
}

async function boot() {
  const res = await fetch("/api/trends");
  state.trends = await res.json();
  if (!state.trends.months.length) {
    $("#app").innerHTML = `<p class="empty">Aucune opération pour l'instant. <a href="/">Retour au tableau de bord</a> pour connecter ta banque ou charger la démo.</p>`;
    return;
  }
  render();
  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(renderChart, 100); });
}

function headline(v) {
  const n = v.months.length;
  const unknown = v.categories.find(c => c.category === "inconnu");
  const unknownTxt = unknown
    ? ` <a href="/">${eur(unknown.total)} restent à classer</a> sur la période, soit ${Math.round(unknown.total / sum(v.categories.map(c => c.total)) * 100)} % des dépenses.`
    : " Toutes les dépenses de la période sont classées.";
  if (state.focus) {
    const c = v.categories.find(x => x.category === state.focus);
    const avg = c.total / n;
    const last = c.amounts[n - 1];
    const prev = n > 1 ? sum(c.amounts.slice(0, -1)) / (n - 1) : null;
    const delta = prev ? Math.round((last / prev - 1) * 100) : null;
    return `<p class="lead">${esc(c.label)} : ${eur(avg)} par mois en moyenne.</p>
      <p class="sub">${eur(last)} en ${monthLong(v.months[n - 1])}${delta !== null && isFinite(delta) ? `, ${delta >= 0 ? "+" : ""}${delta} % par rapport à la moyenne des mois précédents` : ""} (mois en cours possiblement incomplet). Re-clique la catégorie pour revenir à la vue d'ensemble.</p>`;
  }
  const top = v.categories.find(c => c.category !== "inconnu");
  return `<p class="lead">Sur ${n} mois, ${esc(top ? top.label : "?")} pèse le plus : ${eur(top ? top.total / n : 0)} par mois en moyenne.</p>
    <p class="sub">${eur(sum(v.categories.map(c => c.total)) / n)} de dépenses mensuelles en moyenne, épargne et virements internes exclus.${unknownTxt}</p>`;
}

function render() {
  const v = view();
  const focusLabel = (c) => c.category === "autres" ? `Autres (${c.members.length})` : c.label;
  $("#app").innerHTML = `
    <div id="head">${headline(v)}</div>
    <div class="controls">
      ${state.trends.months.length > 6 ? `<div class="seg" role="group" aria-label="Période">
        ${RANGES.map(([k, l]) => `<button data-range="${k}" aria-pressed="${state.range === k}">${l}</button>`).join("")}
      </div>` : ""}
      <span class="hint">Choisis une catégorie pour la poser sur l'axe et comparer les mois.</span>
    </div>
    <ul class="legend ${state.focus ? "has-focus" : ""}" aria-label="Catégories">
      ${v.series.map(s => `<li><button data-focus="${esc(s.category)}" aria-pressed="${state.focus === s.category}" ${s.category === "autres" ? "disabled title=\"" + esc(s.members.length + " petites catégories : choisis-en une dans le tableau") + "\"" : ""}>
        ${swatch(s.category)}${esc(focusLabel(s))} <b>${eur(s.total / v.months.length)}/mois</b></button></li>`).join("")}
    </ul>
    <div class="card"><div id="chart"></div><div class="tip" id="tip" hidden></div></div>

    <section>
      <h2>Détail par mois</h2>
      <p class="hint">Plus la case est foncée, plus le mois est élevé pour cette catégorie. Clique une ligne pour la mettre en avant.</p>
      <div class="scroll">${renderTable(v)}</div>
    </section>`;

  document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { state.range = +b.dataset.range; render(); });
  document.querySelectorAll("[data-focus]").forEach(b => b.onclick = () => {
    state.focus = state.focus === b.dataset.focus ? null : b.dataset.focus;
    render();
  });
  renderChart();
}

function renderTable(v) {
  const n = v.months.length;
  const yearAt = (i) => i === 0 || v.months[i].endsWith("-01");
  const totals = v.months.map((_, i) => sum(v.categories.map(c => c.amounts[i])));
  return `<table>
    <thead><tr><th scope="col">Catégorie</th>${v.months.map((m, i) => `<th scope="col">${monthShort(m, yearAt(i))}</th>`).join("")}<th scope="col">Moyenne</th></tr></thead>
    <tbody>${v.categories.map(c => {
      const max = Math.max(...c.amounts);
      return `<tr data-focus="${esc(c.category)}" class="${state.focus === c.category ? "on" : ""}">
        <th scope="row">${swatch(c.category)}${esc(c.label)}</th>
        ${c.amounts.map(a => a > 0
          ? `<td style="background:color-mix(in srgb, var(--save) ${Math.round(4 + 30 * a / max)}%, transparent)">${eur(a)}</td>`
          : `<td class="z">–</td>`).join("")}
        <td class="avg">${eur(c.total / n)}</td>
      </tr>`; }).join("")}
    </tbody>
    <tfoot><tr><th scope="row">Total</th>${totals.map(t => `<td>${eur(t)}</td>`).join("")}<td>${eur(sum(totals) / n)}</td></tr></tfoot>
  </table>`;
}

function renderChart() {
  const v = view();
  const el = $("#chart");
  const W = el.clientWidth, H = 280;
  const m = { top: 10, right: 6, bottom: state.focus ? 42 : 26, left: 50 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const n = v.months.length;
  const stack = stackOrder(v.series, state.focus);
  const totals = v.months.map((_, i) => sum(stack.map(s => s.amounts[i])));
  const step = niceStep(Math.max(...totals));
  const yMax = Math.ceil(Math.max(...totals) / step) * step || step;
  const y = (val) => m.top + ih - (val / yMax) * ih;
  const band = iw / n;
  const bw = Math.min(46, band * 0.62);
  const showYear = (i) => i === 0 || v.months[i].endsWith("-01");
  const labelEvery = Math.ceil(n / Math.max(1, Math.floor(iw / 52)));  // évite les collisions sur mobile

  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Dépenses mensuelles par catégorie, en barres empilées">
    <defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <rect width="5" height="5" style="fill:var(--surface)"/><rect width="2.5" height="5" style="fill:var(--unknown)"/>
    </pattern></defs>`;
  for (let t = 0; t <= yMax; t += step) {
    svg += `<line class="grid" x1="${m.left}" x2="${W - m.right}" y1="${y(t)}" y2="${y(t)}"/>
      <text x="${m.left - 8}" y="${y(t) + 4}" text-anchor="end">${eur(t)}</text>`;
  }
  v.months.forEach((mo, i) => {
    const cx = m.left + band * i + band / 2, x = cx - bw / 2;
    let acc = 0;
    const visible = stack.filter(s => s.amounts[i] > 0);
    visible.forEach((s, j) => {
      const y0 = y(acc), y1 = y(acc + s.amounts[i]);
      acc += s.amounts[i];
      const h = Math.max(0, y0 - y1 - (j > 0 ? 2 : 0));  // 2px de surface entre segments
      if (h <= 0) return;
      const top = y0 - (j > 0 ? 2 : 0) - h;
      const dim = state.focus && s.category !== state.focus ? "dim" : "";
      const r = j === visible.length - 1 ? Math.min(4, h) : 0;  // extrémité arrondie en haut de pile seulement
      svg += `<path class="seg-mark ${dim}" style="fill:${fill(s.category)}" d="M${x},${top + h}V${top + r}q0,-${r} ${r},-${r}H${x + bw - r}q${r},0 ${r},${r}V${top + h}Z"/>`;
    });
    if (i % labelEvery === 0 || i === n - 1) {
      svg += `<text x="${cx}" y="${H - m.bottom + 16}" text-anchor="middle">${monthShort(mo, showYear(i))}</text>`;
    }
    if (state.focus) {
      const f = stack[0].amounts[i];
      svg += `<text class="v" x="${cx}" y="${H - m.bottom + 33}" text-anchor="middle">${f ? eur(f) : "–"}</text>`;
    }
    svg += `<rect class="col ${state.hover === i ? "on" : ""}" data-i="${i}" x="${m.left + band * i}" y="${m.top}" width="${band}" height="${ih}"/>`;
  });
  el.innerHTML = svg + "</svg>";

  const tip = $("#tip");
  el.querySelectorAll(".col").forEach(c => {
    c.onmouseenter = c.onfocus = () => showTip(v, stack, +c.dataset.i, c);
    c.onmouseleave = () => { tip.hidden = true; c.classList.remove("on"); };
    c.onclick = () => showTip(v, stack, +c.dataset.i, c);  // tap sur mobile
  });
}

function showTip(v, stack, i, col) {
  const tip = $("#tip");
  document.querySelectorAll("#chart .col.on").forEach(c => c.classList.remove("on"));
  col.classList.add("on");
  const rows = [...stack].filter(s => s.amounts[i] > 0).sort((a, b) =>
    (b.category === state.focus) - (a.category === state.focus) || b.amounts[i] - a.amounts[i]);
  tip.innerHTML = `<h3>${monthLong(v.months[i])}</h3>
    ${rows.map(s => `<div class="${s.category === state.focus ? "f" : ""}">${swatch(s.category)}<span>${esc(s.category === "autres" ? `Autres (${s.members.length})` : s.label)}</span><span>${eur(s.amounts[i])}</span></div>`).join("")}
    <div class="t"><span>Total</span><span>${eur(sum(rows.map(s => s.amounts[i])))}</span></div>`;
  tip.hidden = false;
  const card = tip.parentElement.getBoundingClientRect(), r = col.getBoundingClientRect();
  const left = r.left - card.left + r.width / 2 + 14;
  tip.style.left = (left + tip.offsetWidth > card.width ? r.left - card.left + r.width / 2 - tip.offsetWidth - 14 : left) + "px";
  tip.style.top = "12px";
}

boot();
</script>
</body>
</html>
