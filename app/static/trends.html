<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tendances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
main { max-width: 860px; }
header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
header h1 { font-size: 1.05rem; font-weight: 600; margin-right: auto; }
header a { color: var(--muted); font-size: .92rem; text-underline-offset: 3px; }
header a:hover { color: var(--ink); }

.lead { font-size: clamp(1.3rem, 4.4vw, 1.75rem); line-height: 1.25; font-weight: 500; letter-spacing: -.01em; max-width: 30ch; }
.sub { color: var(--muted); margin-top: 10px; max-width: 60ch; }
.sub a { color: inherit; text-underline-offset: 3px; }

/* Période + catégories : une seule rangée de contrôles au-dessus du graphique */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 24px 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; font-size: .88rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.hint { color: var(--muted); font-size: .88rem; }

.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
.legend button {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--surface);
  border-radius: 999px; padding: 4px 11px 4px 9px; font-size: .86rem; cursor: pointer;
}
.legend button b { font-weight: 400; color: var(--muted); }
.legend.has-focus button[aria-pressed="false"] { opacity: .5; }
.legend button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 500; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sw.hatch { background-image: repeating-linear-gradient(45deg, var(--unknown) 0 2px, transparent 2px 4px) !important; box-shadow: inset 0 0 0 1px var(--unknown); }

.card { background: var(--surface); border-radius: 12px; padding: 16px 12px 8px; position: relative; }
#chart svg { display: block; width: 100%; overflow: visible; }
#chart text { font: 400 12px "IBM Plex Sans", system-ui, sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
#chart text.v { fill: var(--ink); font-weight: 500; }
#chart .grid { stroke: var(--rule); stroke-width: 1; }
#chart .col { fill: transparent; cursor: pointer; }
#chart .col:hover, #chart .col.on { fill: var(--ink); fill-opacity: .04; }
#chart .seg-mark { transition: opacity .15s; }
#chart .dim { opacity: .22; }

.tip {
  position: absolute; pointer-events: none; z-index: 2; min-width: 190px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 6px 20px rgb(0 0 0 / .12); padding: 9px 12px; font-size: .84rem;
}
.tip[hidden] { display: none; }
.tip h3 { margin: 0 0 4px; font-size: .86rem; font-weight: 600; }
.tip div { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 1px 0; }
.tip div.f { font-weight: 600; }
.tip div.t { border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 4px; grid-template-columns: 1fr auto; }

section { margin-top: 36px; }
section h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
.scroll { overflow-x: auto; background: var(--surface); border-radius: 12px; margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; }
th { font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--rule); }
tbody tr { cursor: pointer; }
tbody tr:hover th { text-decoration: underline; text-underline-offset: 3px; }
tbody th, thead th:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); color: var(--ink); font-weight: 500; }
tbody th .sw { display: inline-block; margin-right: 8px; vertical-align: -1px; }
tbody tr.on th { font-weight: 600; }
tbody td.z { color: var(--muted); }
td.avg { color: var(--muted); border-left: 1px solid var(--rule); }
tfoot td, tfoot th { border-top: 1px solid var(--rule); font-weight: 600; text-align: right; }
tfoot th { text-align: left; position: sticky; left: 0; background: var(--surface); }

.empty { background: var(--surface); border-radius: 12px; padding: 24px 20px; color: var(--muted); }
.empty a { color: var(--ink); }

/* Bilan entrées / sorties */
#period { margin: 0 0 22px; }
#flow { margin-top: 0; }
tbody.flow tr { cursor: default; }
tbody.flow tr:hover th { text-decoration: none; }
.section-title { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.keys { display: flex; flex-wrap: wrap; gap: 14px; margin: 18px 0 10px; font-size: .86rem; color: var(--muted); list-style: none; padding: 0; }
.keys li { display: inline-flex; align-items: center; gap: 7px; }
.keys i { display: inline-block; flex: none; }
.keys i.ln { width: 16px; height: 2px; border-radius: 1px; }
.keys i.ar { width: 12px; height: 10px; border-radius: 3px; }
#flowchart svg { display: block; width: 100%; overflow: visible; }
#flowchart text { font: 400 12px "IBM Plex Sans", system-ui, sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
#flowchart text.v { fill: var(--ink); font-weight: 500; }
#flowchart text.end { fill: var(--ink); font-weight: 500; }
#flowchart .grid { stroke: var(--rule); stroke-width: 1; }
#flowchart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
#flowchart .col { fill: transparent; cursor: pointer; }
.tip div.t.neg span:last-child { font-weight: 700; }
td.neg { font-weight: 600; }

.advice { background: var(--surface); border-radius: 12px; padding: 16px 18px; margin-top: 16px; }
.advice h3 { margin: 0 0 6px; font-size: .98rem; font-weight: 600; }
.advice .btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 6px 14px; font-size: .9rem; cursor: pointer; }
.advice .btn[disabled] { opacity: .6; cursor: progress; }
.advice .note { color: var(--muted); font-size: .84rem; margin-top: 8px; max-width: 62ch; }
.advice .out { margin-top: 12px; max-width: 64ch; }
.advice .out ul { margin: 10px 0 0; padding-left: 20px; }
.advice .out li { margin: 4px 0; }
.advice .err { color: var(--danger); margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tendances</h1>
    <a href="/">← Mois en cours</a>
  </header>
  <div id="period"></div>
  <section id="flow"></section>
  <section id="app"></section>
</main>

<script src="/static/colors.js"></script>
<script src="/static/trends.js"></script>
<script src="/static/cashflow.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const eur = (n) => new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(n);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const monthLong = (m) => new Date(m + "-01T12:00").toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
const monthShort = (m, withYear) => new Date(m + "-01T12:00").toLocaleDateString("fr-FR", withYear ? { month: "short", year: "2-digit" } : { month: "short" });
const sum = (xs) => xs.reduce((a, b) => a + b, 0);

const TOP = 7;  // 7 catégories nommées + Autres + À classer : au-delà, les teintes ne se distinguent plus
const RANGES = [[6, "6 mois"], [12, "12 mois"], [0, "Tout"]];
// Teinte fixe par catégorie (colors.js) ; les catégories sans teinte propre et « Autres » en gris
// neutre, « À classer » hachuré pour se lire comme « pas encore connu », pas comme une catégorie.
const fill = (c) => c === "inconnu" ? "url(#hatch)" : c === "autres" ? "var(--other)"
  : (CAT_COLOR[c] || (c === state.focus ? "var(--ink)" : "var(--other)"));
const swatch = (c) => `<i class="sw ${c === "inconnu" ? "hatch" : ""}" style="background:${fill(c) === "url(#hatch)" ? "transparent" : fill(c)}"></i>`;

let state = { trends: null, cashflow: null, range: 12, focus: new URLSearchParams(location.search).get("cat"), hover: null,
  advice: {}, adviceLoading: null };  // /tendances?cat=courses ; advice : réponse du LLM par période

function view() {
  const v = lastMonths(state.trends, state.range);
  if (state.focus && !v.categories.some(c => c.category === state.focus)) state.focus = null;
  return { ...v, series: groupSeries(v.categories, TOP, state.focus, (c) => c in CAT_COLOR) };
}

async function boot() {
  const [trends, cashflow] = await Promise.all(["/api/trends", "/api/cashflow"].map(u => fetch(u).then(r => r.json())));
  state.trends = trends;
  state.cashflow = cashflow;
  if (!state.trends.months.length) {
    $("#app").innerHTML = `<p class="empty">Aucune opération pour l'instant. <a href="/">Retour au tableau de bord</a> pour connecter ta banque ou charger la démo.</p>`;
    return;
  }
  render();
  let t;
  addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { renderFlowChart(); renderChart(); }, 100); });
}

function headline(v) {
  const n = v.months.length;
  const unknown = v.categories.find(c => c.category === "inconnu");
  const unknownTxt = unknown
    ? ` <a href="/">${eur(unknown.total)} restent à classer</a> sur la période, soit ${Math.round(unknown.total / sum(v.categories.map(c => c.total)) * 100)} % des dépenses.`
    : " Toutes les dépenses de la période sont classées.";
  if (state.focus) {
    const c = v.categories.find(x => x.category === state.focus);
    const avg = c.total / n;
    const last = c.amounts[n - 1];
    const prev = n > 1 ? sum(c.amounts.slice(0, -1)) / (n - 1) : null;
    const delta = prev ? Math.round((last / prev - 1) * 100) : null;
    return `<p class="lead">${esc(c.label)} : ${eur(avg)} par mois en moyenne.</p>
      <p class="sub">${eur(last)} en ${monthLong(v.months[n - 1])}${delta !== null && isFinite(delta) ? `, ${delta >= 0 ? "+" : ""}${delta} % par rapport à la moyenne des mois précédents` : ""} (mois en cours possiblement incomplet). Re-clique la catégorie pour revenir à la vue d'ensemble.</p>`;
  }
  const top = v.categories.find(c => c.category !== "inconnu");
  return `<p class="lead">Sur ${n} mois, ${esc(top ? top.label : "?")} pèse le plus : ${eur(top ? top.total / n : 0)} par mois en moyenne.</p>
    <p class="sub">${eur(sum(v.categories.map(c => c.total)) / n)} de dépenses mensuelles en moyenne, épargne et virements internes exclus.${unknownTxt}</p>`;
}

function render() {
  const v = view();
  const focusLabel = (c) => c.category === "autres" ? `Autres (${c.members.length})` : c.label;
  $("#period").innerHTML = state.trends.months.length > 6 ? `<div class="seg" role="group" aria-label="Période">
      ${RANGES.map(([k, l]) => `<button data-range="${k}" aria-pressed="${state.range === k}">${l}</button>`).join("")}
    </div>` : "";
  renderFlow();
  $("#app").innerHTML = `
    <h2 class="section-title">Dépenses par catégorie</h2>
    <div id="head">${headline(v)}</div>
    <div class="controls">
      <span class="hint">Choisis une catégorie pour la poser sur l'axe et comparer les mois.</span>
    </div>
    <ul class="legend ${state.focus ? "has-focus" : ""}" aria-label="Catégories">
      ${v.series.map(s => `<li><button data-focus="${esc(s.category)}" aria-pressed="${state.focus === s.category}" ${s.category === "autres" ? "disabled title=\"" + esc(s.members.length + " petites catégories : choisis-en une dans le tableau") + "\"" : ""}>
        ${swatch(s.category)}${esc(focusLabel(s))} <b>${eur(s.total / v.months.length)}/mois</b></button></li>`).join("")}
    </ul>
    <div class="card"><div id="chart"></div><div class="tip" id="tip" hidden></div></div>

    <section>
      <h2>Détail par mois</h2>
      <p class="hint">Plus la case est foncée, plus le mois est élevé pour cette catégorie. Clique une ligne pour la mettre en avant.</p>
      <div class="scroll">${renderTable(v)}</div>
    </section>`;

  document.querySelectorAll("[data-range]").forEach(b => b.onclick = () => { state.range = +b.dataset.range; render(); });
  document.querySelectorAll("[data-focus]").forEach(b => b.onclick = () => {
    state.focus = state.focus === b.dataset.focus ? null : b.dataset.focus;
    render();
  });
  renderChart();
}

function renderTable(v) {
  const n = v.months.length;
  const yearAt = (i) => i === 0 || v.months[i].endsWith("-01");
  const totals = v.months.map((_, i) => sum(v.categories.map(c => c.amounts[i])));
  return `<table>
    <thead><tr><th scope="col">Catégorie</th>${v.months.map((m, i) => `<th scope="col">${monthShort(m, yearAt(i))}</th>`).join("")}<th scope="col">Moyenne</th></tr></thead>
    <tbody>${v.categories.map(c => {
      const max = Math.max(...c.amounts);
      return `<tr data-focus="${esc(c.category)}" class="${state.focus === c.category ? "on" : ""}">
        <th scope="row">${swatch(c.category)}${esc(c.label)}</th>
        ${c.amounts.map(a => a > 0
          ? `<td style="background:color-mix(in srgb, var(--save) ${Math.round(4 + 30 * a / max)}%, transparent)">${eur(a)}</td>`
          : `<td class="z">–</td>`).join("")}
        <td class="avg">${eur(c.total / n)}</td>
      </tr>`; }).join("")}
    </tbody>
    <tfoot><tr><th scope="row">Total</th>${totals.map(t => `<td>${eur(t)}</td>`).join("")}<td>${eur(sum(totals) / n)}</td></tr></tfoot>
  </table>`;
}

function renderChart() {
  const v = view();
  const el = $("#chart");
  const W = el.clientWidth, H = 280;
  const m = { top: 10, right: 6, bottom: state.focus ? 42 : 26, left: 50 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const n = v.months.length;
  const stack = stackOrder(v.series, state.focus);
  const totals = v.months.map((_, i) => sum(stack.map(s => s.amounts[i])));
  const step = niceStep(Math.max(...totals));
  const yMax = Math.ceil(Math.max(...totals) / step) * step || step;
  const y = (val) => m.top + ih - (val / yMax) * ih;
  const band = iw / n;
  const bw = Math.min(46, band * 0.62);
  const showYear = (i) => i === 0 || v.months[i].endsWith("-01");
  const labelEvery = Math.ceil(n / Math.max(1, Math.floor(iw / 52)));  // évite les collisions sur mobile

  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Dépenses mensuelles par catégorie, en barres empilées">
    <defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <rect width="5" height="5" style="fill:var(--surface)"/><rect width="2.5" height="5" style="fill:var(--unknown)"/>
    </pattern></defs>`;
  for (let t = 0; t <= yMax; t += step) {
    svg += `<line class="grid" x1="${m.left}" x2="${W - m.right}" y1="${y(t)}" y2="${y(t)}"/>
      <text x="${m.left - 8}" y="${y(t) + 4}" text-anchor="end">${eur(t)}</text>`;
  }
  v.months.forEach((mo, i) => {
    const cx = m.left + band * i + band / 2, x = cx - bw / 2;
    let acc = 0;
    const visible = stack.filter(s => s.amounts[i] > 0);
    visible.forEach((s, j) => {
      const y0 = y(acc), y1 = y(acc + s.amounts[i]);
      acc += s.amounts[i];
      const h = Math.max(0, y0 - y1 - (j > 0 ? 2 : 0));  // 2px de surface entre segments
      if (h <= 0) return;
      const top = y0 - (j > 0 ? 2 : 0) - h;
      const dim = state.focus && s.category !== state.focus ? "dim" : "";
      const r = j === visible.length - 1 ? Math.min(4, h) : 0;  // extrémité arrondie en haut de pile seulement
      svg += `<path class="seg-mark ${dim}" style="fill:${fill(s.category)}" d="M${x},${top + h}V${top + r}q0,-${r} ${r},-${r}H${x + bw - r}q${r},0 ${r},${r}V${top + h}Z"/>`;
    });
    if (i % labelEvery === 0 || i === n - 1) {
      svg += `<text x="${cx}" y="${H - m.bottom + 16}" text-anchor="middle">${monthShort(mo, showYear(i))}</text>`;
    }
    if (state.focus) {
      const f = stack[0].amounts[i];
      svg += `<text class="v" x="${cx}" y="${H - m.bottom + 33}" text-anchor="middle">${f ? eur(f) : "–"}</text>`;
    }
    svg += `<rect class="col ${state.hover === i ? "on" : ""}" data-i="${i}" x="${m.left + band * i}" y="${m.top}" width="${band}" height="${ih}"/>`;
  });
  el.innerHTML = svg + "</svg>";

  const tip = $("#tip");
  el.querySelectorAll(".col").forEach(c => {
    c.onmouseenter = c.onfocus = () => showTip(v, stack, +c.dataset.i, c);
    c.onmouseleave = () => { tip.hidden = true; c.classList.remove("on"); };
    c.onclick = () => showTip(v, stack, +c.dataset.i, c);  // tap sur mobile
  });
}

function showTip(v, stack, i, col) {
  const tip = $("#tip");
  document.querySelectorAll("#chart .col.on").forEach(c => c.classList.remove("on"));
  col.classList.add("on");
  const rows = [...stack].filter(s => s.amounts[i] > 0).sort((a, b) =>
    (b.category === state.focus) - (a.category === state.focus) || b.amounts[i] - a.amounts[i]);
  tip.innerHTML = `<h3>${monthLong(v.months[i])}</h3>
    ${rows.map(s => `<div class="${s.category === state.focus ? "f" : ""}">${swatch(s.category)}<span>${esc(s.category === "autres" ? `Autres (${s.members.length})` : s.label)}</span><span>${eur(s.amounts[i])}</span></div>`).join("")}
    <div class="t"><span>Total</span><span>${eur(sum(rows.map(s => s.amounts[i])))}</span></div>`;
  tip.hidden = false;
  const card = tip.parentElement.getBoundingClientRect(), r = col.getBoundingClientRect();
  const left = r.left - card.left + r.width / 2 + 14;
  tip.style.left = (left + tip.offsetWidth > card.width ? r.left - card.left + r.width / 2 - tip.offsetWidth - 14 : left) + "px";
  tip.style.top = "12px";
}

// --- Entrées / sorties ---------------------------------------------------------

const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + eur(Math.abs(n));
const adviceMonths = () => state.range || 36;

function flowHeadline(f) {
  const done = f.months.map((_, i) => i).filter(i => i !== f.partialIndex);
  if (!done.length) return `<p class="lead">Premier mois en cours : le bilan s'affichera une fois un mois complet.</p>`;
  const avg = (xs) => sum(done.map(i => xs[i])) / done.length;
  const net = avg(f.net), deficits = done.filter(i => f.net[i] < 0);
  const lead = net < 0
    ? `Sur ${done.length} mois, tes sorties dépassent tes entrées de ${eur(-net)} par mois en moyenne.`
    : `Sur ${done.length} mois, il te reste ${eur(net)} par mois en moyenne une fois les dépenses payées.`;
  const months = deficits.map(i => monthShort(f.months[i], false)).join(", ");
  const savings = avg(f.savings);
  return `<p class="lead">${lead}</p>
    <p class="sub">${deficits.length ? `${deficits.length} mois en déficit sur ${done.length} (${months}).` : "Aucun mois en déficit."}
    ${savings > 0 ? ` Épargne versée à part : ${eur(savings)} par mois en moyenne, non comptée dans les sorties.` : ""}
    ${f.partialIndex >= 0 ? ` Le mois de ${monthLong(f.months[f.partialIndex])} est en cours : en pointillés, hors moyennes.` : ""}</p>`;
}

function renderFlow() {
  const f = flowView(state.cashflow, state.range);
  const n = adviceMonths();
  const complete = state.cashflow.months.length - (state.cashflow.partial ? 1 : 0);
  const k = Math.min(n, complete);
  const a = state.advice[n];
  const loading = state.adviceLoading === n;
  $("#flow").innerHTML = `
    <h2 class="section-title">Entrées et sorties</h2>
    ${flowHeadline(f)}
    <ul class="keys" aria-label="Légende">
      <li><i class="ln" style="background:var(--flow-in)"></i>Entrées (salaires, remboursements)</li>
      <li><i class="ln" style="background:var(--flow-out)"></i>Sorties (hors épargne et virements internes)</li>
      <li><i class="ar" style="background:color-mix(in srgb, var(--keep) 22%, transparent)"></i>Excédent</li>
      <li><i class="ar" style="background:color-mix(in srgb, var(--danger) 26%, transparent)"></i>Déficit</li>
    </ul>
    <div class="card"><div id="flowchart"></div><div class="tip" id="flowtip" hidden></div></div>
    <div class="scroll">${renderFlowTable(f)}</div>
    ${f.partialIndex >= 0 ? `<p class="hint" style="margin-top:6px">* mois en cours, incomplet : exclu des moyennes.</p>` : ""}
    <div class="advice">
      <h3>Conseils sur ${k > 1 ? `les ${k} derniers mois complets` : "le dernier mois complet"}</h3>
      ${k ? `<button class="btn" id="ask" ${loading ? "disabled" : ""}>${loading ? "Analyse en cours…" : a && !a.error ? "Relancer l'analyse" : "Demander une synthèse"}</button>` : `<p class="note">Disponible dès le premier mois complet.</p>`}
      <p class="note">Le LLM configuré pour la catégorisation reçoit uniquement des totaux par mois et par catégorie : aucun nom de marchand, libellé ni IBAN. Le mois en cours n'est pas pris en compte.${loading ? " Un modèle local peut mettre une minute." : ""}</p>
      ${a && a.error ? `<p class="err">${esc(a.error)}</p>` : ""}
      ${a && !a.error ? `<div class="out"><p>${esc(a.synthese)}</p>
        ${a.conseils.length ? `<ul>${a.conseils.map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
        <p class="note">${esc(a.provider)} · ${esc(a.model)} · ${a.months.length} mois analysés</p></div>` : ""}
    </div>`;
  if (k) $("#ask").onclick = () => askAdvice(n);
  renderFlowChart();
}

async function askAdvice(n) {
  state.adviceLoading = n;
  renderFlow();
  try {
    const r = await fetch("/api/advice", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ months: n }) });
    const body = await r.json().catch(() => ({}));
    state.advice[n] = r.ok ? body : { error: typeof body.detail === "string" ? body.detail : `Erreur ${r.status}` };
  } catch {
    state.advice[n] = { error: "Le serveur ne répond pas." };
  }
  state.adviceLoading = null;
  renderFlow();
}

function renderFlowTable(f) {
  const done = f.months.map((_, i) => i).filter(i => i !== f.partialIndex);
  const avg = (xs) => done.length ? sum(done.map(i => xs[i])) / done.length : 0;
  const yearAt = (i) => i === 0 || f.months[i].endsWith("-01");
  const row = (label, xs, cell = (x) => `<td>${eur(x)}</td>`, avgCell = (x) => eur(x)) =>
    `<tr><th scope="row">${label}</th>${xs.map(cell).join("")}<td class="avg">${avgCell(avg(xs))}</td></tr>`;
  const tint = (x) => x ? `background:color-mix(in srgb, var(${x < 0 ? "--danger" : "--keep"}) ${x < 0 ? 18 : 12}%, transparent)` : "";
  return `<table>
    <thead><tr><th scope="col"></th>${f.months.map((m, i) => `<th scope="col">${monthShort(m, yearAt(i))}${i === f.partialIndex ? "*" : ""}</th>`).join("")}<th scope="col">Moyenne</th></tr></thead>
    <tbody class="flow">
      ${row("Entrées", f.income)}
      ${row("Sorties", f.spent)}
      ${row("Solde", f.net, (x, i) => i === f.partialIndex ? `<td class="z">${signed(x)}</td>` : `<td class="${x < 0 ? "neg" : ""}" style="${tint(x)}">${signed(x)}</td>`, signed)}
      ${row("Épargne", f.savings)}
    </tbody>
  </table>`;
}

function renderFlowChart() {
  const f = flowView(state.cashflow, state.range);
  const el = $("#flowchart");
  if (!el) return;
  const W = el.clientWidth, H = 260;
  const n = f.months.length;
  const band = (W - 50 - 70) / n;
  const showNet = band >= 46;
  const m = { top: 12, right: 70, bottom: showNet ? 42 : 26, left: 50 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const max = Math.max(...f.income, ...f.spent);
  const step = niceStep(max);
  const yMax = Math.ceil(max / step) * step || step;
  const y = (v) => m.top + ih - (v / yMax) * ih;
  const x = (t) => m.left + band * t + band / 2;
  const showYear = (i) => i === 0 || f.months[i].endsWith("-01");
  const labelEvery = Math.ceil(n / Math.max(1, Math.floor(iw / 52)));
  const last = f.partialIndex >= 0 ? f.partialIndex - 1 : n - 1;  // dernier mois complet

  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Entrées et sorties par mois, en lignes, écart teinté selon excédent ou déficit">`;
  for (let t = 0; t <= yMax; t += step) {
    svg += `<line class="grid" x1="${m.left}" x2="${W - m.right}" y1="${y(t)}" y2="${y(t)}"/>
      <text x="${m.left - 8}" y="${y(t) + 4}" text-anchor="end">${eur(t)}</text>`;
  }
  // Le mois en cours (salaire souvent pas encore tombé) n'est pas teinté : son « déficit » n'en est pas un.
  for (const r of gapRegions(f.income.slice(0, last + 1), f.spent.slice(0, last + 1))) {
    if (r.pts.length < 2) continue;
    const d = "M" + r.pts.map(p => `${x(p.t)},${y(p.a)}`).join("L") + "L" + [...r.pts].reverse().map(p => `${x(p.t)},${y(p.b)}`).join("L") + "Z";
    svg += `<path d="${d}" style="fill:var(${r.sign < 0 ? "--danger" : "--keep"});fill-opacity:${r.sign < 0 ? .26 : .2}"/>`;
  }
  const line = (xs, color) => {
    const pts = xs.map((v, i) => `${x(i)},${y(v)}`);
    let out = last >= 1 ? `<polyline points="${pts.slice(0, last + 1).join(" ")}" style="fill:none;stroke:${color};stroke-width:2;stroke-linejoin:round"/>` : "";
    if (f.partialIndex > 0) out += `<polyline points="${pts.slice(last, n).join(" ")}" style="fill:none;stroke:${color};stroke-width:2;stroke-dasharray:4 4"/>`;
    xs.forEach((v, i) => {
      out += `<circle cx="${x(i)}" cy="${y(v)}" r="4" style="fill:${i === f.partialIndex ? "var(--surface)" : color};stroke:${i === f.partialIndex ? color : "var(--surface)"};stroke-width:2"/>`;
    });
    return out;
  };
  svg += line(f.spent, "var(--flow-out)") + line(f.income, "var(--flow-in)");
  // Étiquettes directes en bout de courbe, écartées si les deux valeurs sont proches
  let yi = y(f.income[n - 1]) + 4, ys = y(f.spent[n - 1]) + 4;
  if (Math.abs(yi - ys) < 14) {
    const mid = (yi + ys) / 2, up = f.income[n - 1] >= f.spent[n - 1];
    yi = mid + (up ? -7 : 7); ys = mid + (up ? 7 : -7);
  }
  svg += `<text class="end" x="${x(n - 1) + 10}" y="${yi}">Entrées</text><text class="end" x="${x(n - 1) + 10}" y="${ys}">Sorties</text>`;
  f.months.forEach((mo, i) => {
    if (i % labelEvery === 0 || i === n - 1) {
      svg += `<text x="${x(i)}" y="${H - m.bottom + 16}" text-anchor="middle">${monthShort(mo, showYear(i))}${i === f.partialIndex ? "*" : ""}</text>`;
    }
    if (showNet) svg += `<text class="${i === f.partialIndex ? "" : "v"}" x="${x(i)}" y="${H - m.bottom + 33}" text-anchor="middle">${i === f.partialIndex ? "en cours" : signed(f.net[i])}</text>`;
    svg += `<rect class="col" data-i="${i}" x="${m.left + band * i}" y="${m.top}" width="${band}" height="${ih}"/>`;
  });
  el.innerHTML = svg + "</svg>";

  const tip = $("#flowtip");
  el.querySelectorAll(".col").forEach(c => {
    const show = () => showFlowTip(f, +c.dataset.i, c, x(+c.dataset.i), m.top, m.top + ih);
    c.onmouseenter = c.onclick = show;
    c.onmouseleave = () => { tip.hidden = true; el.querySelector(".cross")?.remove(); };
  });
}

function showFlowTip(f, i, col, cx, y0, y1) {
  const tip = $("#flowtip");
  const svg = col.ownerSVGElement;
  svg.querySelector(".cross")?.remove();
  svg.insertAdjacentHTML("afterbegin", `<line class="cross" x1="${cx}" x2="${cx}" y1="${y0}" y2="${y1}"/>`);
  const key = (c) => `<i class="sw" style="background:${c}"></i>`;
  tip.innerHTML = `<h3>${monthLong(f.months[i])}${i === f.partialIndex ? " (en cours)" : ""}</h3>
    <div>${key("var(--flow-in)")}<span>Entrées</span><span>${eur(f.income[i])}</span></div>
    <div>${key("var(--flow-out)")}<span>Sorties</span><span>${eur(f.spent[i])}</span></div>
    <div class="t ${f.net[i] < 0 ? "neg" : ""}"><span>Solde</span><span>${signed(f.net[i])}</span></div>
    ${f.savings[i] ? `<div class="t"><span>Épargne versée</span><span>${eur(f.savings[i])}</span></div>` : ""}`;
  tip.hidden = false;
  const card = tip.parentElement.getBoundingClientRect(), r = col.getBoundingClientRect();
  const left = r.left - card.left + r.width / 2 + 14;
  tip.style.left = (left + tip.offsetWidth > card.width ? r.left - card.left + r.width / 2 - tip.offsetWidth - 14 : left) + "px";
  tip.style.top = "12px";
}

boot();
</script>
</body>
