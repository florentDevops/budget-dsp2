- {pattern: "NETFLIX|SPOTIFY|DEEZER|DISNEY|CANAL\\+|CANALPLUS|AMAZON PRIME|PRIME VIDEO|APPLE\\.COM|ICLOUD|GOOGLE ONE|YOUTUBE|PARAMOUNT|OPENAI|CHATGPT|ANTHROPIC|ADOBE|MICROSOFT 365|BASIC.?FIT|FITNESS PARK|NEONESS|KEEP COOL|AUDIBLE", category: abonnements}
