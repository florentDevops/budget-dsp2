# Règles évaluées dans l'ordre sur le libellé nettoyé (majuscules, sans accents).
# La première règle qui matche gagne : mets les plus spécifiques en haut.
# pattern = expression régulière Python.

- {pattern: "LIVRET|ASSURANCE VIE|\\bPEA\\b|EPARGNE|PER INDIVIDUEL", category: epargne}
- {pattern: "\\bREMB(OURSEMENT)?S?\\b|CPAM REMB|SPENDESK|NOTE DE FRAIS", category: remboursements}
- {pattern: "SALAIRE|\\bPAIE\\b|\\bCAF\\b|FRANCE TRAVAIL|POLE EMPLOI", category: revenus}
- {pattern: "LOYER|FONCIA|NEXITY|CITYA|SYNDIC|ORPI GESTION", category: logement}
