services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Le conteneur doit joindre Ollama sur la machine hôte, pas sur localhost du conteneur.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./certs:/app/certs:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --ssl-keyfile
      - /app/certs/budget-dsp2.local-key.pem
      - --ssl-certfile
      - /app/certs/budget-dsp2.local.pem
    restart: unless-stopped
